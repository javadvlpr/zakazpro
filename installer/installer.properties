# ZakazPro installer configuration.
# Read by com.mebelsex.release.InstallerBuilder (see installer\README-installer.md).
# ASCII only; the JVM reads it as UTF-8.

# --- identity shown by the installer and in "Programs and features" ---
app.name=ZakazPro
app.vendor=ZakazPro
# Uzbek one-line description of the product.
app.description=Buyurtma va sex hisobini yuritish dasturi
app.copyright=(c) 2026 ZakazPro

# --- Windows integration ---
# Start-menu group and the installed program folder name.
app.menu.group=ZakazPro
# STABLE upgrade id: a newer installer with the same id upgrades the old installation.
# Generated once. NEVER change it, or upgrades turn into two parallel installations.
app.upgrade.uuid=c3138c4d-c7aa-4b27-a524-eb2a1c59d38e

# --- packaged application ---
# One option per space-separated word; each becomes its own --java-options.
# Never put any mebelsex.license.* option here (the release gate fails the build).
app.jvm.options=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Xmx768m -XX:+UseSerialGC
# Extra JDK modules added to the fixed base list (comma separated, may be empty).
jdk.extra.modules=
# Icon built by com.mebelsex.release.IconBuilder from installer/assets/zakazpro-icon.png.
icon.path=installer/assets/zakazpro.ico
# Source PNG used when the .ico is missing.
icon.source=installer/assets/zakazpro-icon.png
