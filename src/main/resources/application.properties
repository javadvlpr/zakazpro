spring.application.name=mebelsex

# No web server
spring.main.web-application-type=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# DataSource — path injected by Launcher via system property
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${mebelsex.db.path}?foreign_keys=on&journal_mode=wal&busy_timeout=5000

# Hikari — single writer for SQLite
spring.datasource.hikari.maximum-pool-size=1
